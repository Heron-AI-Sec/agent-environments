# =============================================================================
# RFC-0005 Security Domain layer for the Attack_me_1 testbed.
#
# IMPORTANT — scope & honesty note:
#   RFC-0005 is an aces-schema DOMAIN (it defines the types AttackRelationship,
#   EdgeConditions, EdgeMeta, Credential, CredentialPolicy). It does NOT define
#   a top-level resource `kind`, so this is a plain data file, not an
#   apiVersion/kind resource. Entities (`src`/`dst`) are entity IDs; the Host
#   entities map to RFC-0001 topology nodes web/backend/sql by id.
#
#   RFC-0005's edge taxonomy is built for Active Directory / cloud attack
#   graphs (BloodHound edge types). The Attack_me_1 chain (HTTP recon -> SSH ->
#   XOR-decoded API key -> internal API -> MySQL) is NOT an AD/cloud chain, so
#   only a SUBSET of edges map cleanly. Where no exact edge type exists, the
#   closest valid `EdgeType` is used and the imprecision is flagged in a
#   `mitre_technique_id` annotation (the only free-form metadata RFC-0005 §3
#   permits besides `spn`). No invented edge types, node types, fields, or keys
#   are used below — every field is from RFC-0005 §1/§2/§3/§4/§9/§10/§14.
#
# Field reference:
#   AttackRelationship: edge_id, type, src, dst, src_type, dst_type,
#                       conditions{requires_auth,requires_session,
#                       requires_cred_type}, severity, classification,
#                       meta{spn, mitre_technique_id}                (§14)
#   Credential kinds: password | ntlm_hash | ... | api_key | ...     (§4)
#   CredentialPolicy: weak, reused, expires, managed, rotated        (§4)
#   NodeType: Host | Principal | Credential | Service | ... | Artifact (§1)
# =============================================================================

# -----------------------------------------------------------------------------
# Credentials (RFC-0005 §4). Each is a Credential entity with a kind and a
# CredentialPolicy. Plaintext/identity values are recorded as free context for
# the testbed; the schema-defined object is {kind, policy}.
# -----------------------------------------------------------------------------
credentials:
  - id: cred-ssh                      # Credential entity id
    kind: password                    # §4
    policy:                           # CredentialPolicy §4
      weak: true                      # hard-coded, leaked in plaintext
      reused: false
      expires: false
      managed: false
      rotated: false

  - id: cred-api-key                  # decoded backend API key
    kind: api_key                     # §4
    policy:
      weak: true                      # only single-byte XOR "obfuscation"
      reused: false
      expires: false
      managed: false
      rotated: false

  - id: cred-db-root                  # MySQL root password
    kind: password                    # §4
    policy:
      weak: true                      # hard-coded in compose env
      reused: true                    # backend DB_PASSWORD == sql MYSQL_ROOT_PASSWORD
      expires: false
      managed: false
      rotated: false

# -----------------------------------------------------------------------------
# Attack relationships (RFC-0005 §2/§14). Directed, typed edges between
# entities. Only schema fields are used. Edge `type` values are from RFC-0005's
# EdgeType enum; `classification` from §9; `severity` from §10.
# -----------------------------------------------------------------------------
edges:
  # SSH password authenticates to the webadmin principal on the web host.
  # `Authenticates` (Credential -> Principal) is the exact RFC-0005 §2.1 edge.
  - edge_id: e-ssh-authenticates-webadmin
    type: Authenticates
    src: cred-ssh
    dst: principal-webadmin
    src_type: Credential
    dst_type: Principal
    conditions:
      requires_auth: false
      requires_session: false
      requires_cred_type: password
    severity: info                    # §10: Authenticates = info
    classification: credential        # §9
    meta:
      mitre_technique_id: T1078       # Valid Accounts

  # webadmin principal gets interactive remote access to the web host via SSH.
  # No SSH-specific edge exists; `CanRDP` (Principal -> Host, interactive remote
  # login) is the closest valid §2.2 HOST_TARGETING edge. Imprecision flagged.
  - edge_id: e-webadmin-remote-web
    type: CanRDP
    src: principal-webadmin
    dst: host-web
    src_type: Principal
    dst_type: Host
    conditions:
      requires_auth: true
      requires_session: false
      requires_cred_type: password
    severity: medium                  # §10: CanRDP = medium
    classification: host_targeting    # §9
    meta:
      mitre_technique_id: T1021.004   # Remote Services: SSH (approximated by CanRDP)

  # The web host holds the API-key credential in its source (web/config.py).
  # `HasCredential` (Principal/Host -> Credential) per §2.1/§2.12.
  - edge_id: e-web-hascredential-apikey
    type: HasCredential
    src: host-web
    dst: cred-api-key
    src_type: Host
    dst_type: Credential
    conditions:
      requires_auth: false
      requires_session: true          # need a shell on web to read the file
      requires_cred_type: null
    severity: info                    # §10: HasCredential = info
    classification: credential        # §9
    meta:
      mitre_technique_id: T1552.001   # Unsecured Credentials: Credentials in Files

  # The decoded API key authenticates to the backend service host.
  # `Authenticates` (Credential -> Host treated as service principal). Using
  # dst_type Host (the backend container). §2.1 semantic.
  - edge_id: e-apikey-authenticates-backend
    type: Authenticates
    src: cred-api-key
    dst: host-backend
    src_type: Credential
    dst_type: Host
    conditions:
      requires_auth: false
      requires_session: false
      requires_cred_type: api_key
    severity: info                    # §10: Authenticates = info
    classification: credential        # §9
    meta:
      mitre_technique_id: T1078       # Valid Accounts (API key)

  # The backend host has admin DB access to the sql host. `SQLAdmin`
  # (Principal -> Host) is the exact RFC-0005 §2.2/§2.8 edge for SQL admin
  # access; src is the backend host acting with the root DB credential.
  - edge_id: e-backend-sqladmin-sql
    type: SQLAdmin
    src: host-backend
    dst: host-sql
    src_type: Host
    dst_type: Host
    conditions:
      requires_auth: true
      requires_session: false
      requires_cred_type: password
    severity: medium                  # §10: SQLAdmin = medium
    classification: host_targeting    # §9
    meta:
      mitre_technique_id: T1078       # Valid Accounts (DB root)
