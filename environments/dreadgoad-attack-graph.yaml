# ==============================================================================
# Blue Team Investigation Model
# ==============================================================================
blue_team:
  roles:
    - role: orchestrator
      agent: blue-orchestrator
      description: "Coordinates investigation workflow across blue team agents"
      capabilities: [dispatch_investigation, correlate_red_blue, generate_report]

    - role: triage
      agent: blue-triage
      description: "Initial alert assessment, IOC extraction, severity determination"
      capabilities: [query_loki, query_prometheus, classify_ioc, record_evidence]
      expected_queries_per_alert: 8-12

    - role: threat_hunter
      agent: blue-threat-hunter
      description: "Deep technique detection, root cause analysis, MITRE mapping"
      capabilities: [query_loki, query_prometheus, map_mitre_technique, update_timeline]
      expected_queries_per_investigation: 14+

    - role: lateral_analyst
      agent: blue-lateral-analyst
      description: "Lateral movement scoping, blast radius determination"
      capabilities: [query_loki, query_prometheus, build_lateral_graph]
      expected_queries_per_investigation: 20+

  investigation_stages:
    - stage: triage
      description: "Initial alert assessment"
      exit_criteria: "Severity determined, key IOCs extracted"
      assigned_role: triage

    - stage: causation
      description: "Root cause analysis"
      exit_criteria: "Attack technique identified, initial evidence collected"
      assigned_role: threat_hunter

    - stage: lateral
      description: "Scope determination"
      exit_criteria: "All affected hosts/users identified"
      assigned_role: lateral_analyst

    - stage: synthesis
      description: "Final analysis and reporting"
      exit_criteria: "Attack synopsis written, recommendations generated"
      assigned_role: orchestrator

  evidence_pyramid:
    description: "Pyramid of Pain evidence classification"
    levels:
      - level: 1
        category: hash
        description: "File hashes (trivial to change)"
        examples: ["MD5/SHA256 of tools dropped by red team"]

      - level: 2
        category: ip
        description: "IP addresses"
        examples: ["Agent pod IPs, lateral movement source IPs"]

      - level: 3
        category: domain
        description: "Domain names"
        examples: ["DNS queries, AD domain references"]

      - level: 4
        category: artifact
        description: "Network/host artifacts"
        examples: ["Registry keys, file paths, user agents, service names"]

      - level: 5
        category: tool
        description: "Attacker tooling signatures"
        examples: ["Impacket, certipy, bloodhound-python, netexec"]

      - level: 6
        category: ttp
        description: "Tactics, techniques, procedures"
        examples: ["T1003.006 DCSync, T1558.003 Kerberoasting, T1649 ADCS"]

  scoring_metrics:
    - name: detection_rate
      description: "Percentage of red team actions detected"
      formula: "alerts_triaged / red_actions_total"

    - name: time_to_detect
      description: "Average latency from attack to first alert"
      unit: seconds

    - name: pyramid_elevation
      description: "Average evidence level achieved (1-6)"
      target: ">= 5 (tools or TTPs)"

    - name: investigation_completeness
      description: "Did the agent reach synthesis stage?"
      type: boolean

    - name: scope_accuracy
      description: "Correctly identified affected hosts"
      formula: "correct_hosts / actual_hosts"

    - name: false_positive_rate
      description: "Incorrect escalations"
      formula: "false_escalations / total_escalations"
